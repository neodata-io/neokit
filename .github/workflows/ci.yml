name: CI
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, so a new advisory against an unchanged go.mod still fails a build.
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No job writes to the repository, so the token cannot either.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Both, not one: 1.26.0 is go.mod's floor and the oldest toolchain a
      # consumer may still be on, while stable is where the stdlib advisories
      # are actually fixed. Testing only the floor ships known-vulnerable
      # builds; testing only stable lets the floor rot unnoticed.
      fail-fast: false
      matrix:
        go: ["1.26.0", "stable"]
    name: test (go ${{ matrix.go }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...
      # Fails when a modernizer has something left to rewrite.
      - if: matrix.go == 'stable'
        run: test -z "$(go fix -diff ./...)"

  vuln:
    # Dependabot only bumps direct requirements; this also covers indirect ones
    # and the standard library.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      - run: test -z "$(gofmt -l .)"
      # Built from source at a pinned version, like govulncheck above.
      - run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...

  image:
    # The reference Dockerfile is what new services copy, so it must keep building.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f examples/reference/Dockerfile -t reference .
